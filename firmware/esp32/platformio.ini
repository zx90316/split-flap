[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags = -Wall -Wextra
build_src_flags = -Werror
; The generic WROOM-32/4MB profile is provisional: verify the actual board/flash.
; Serial commissioning first; Wi-Fi/web UI are not ported in this build.
