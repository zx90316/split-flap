<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">單主控正常運作：ESP32-CAM＋四片 MCP23017</title><desc id="desc">四片使用 0x20～0x23；六片庫存中兩片備用。依板上印字接線，圖框不是實際排針順序。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans CJK TC",sans-serif;fill:#183f36}.wire{fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="1440" height="1080" fill="#f3f6ef"/>
<text x="45" y="62" font-size="30" font-weight="bold" text-anchor="start" style="fill:#183f36">單主控正常運作：ESP32-CAM＋四片 MCP23017</text>
<text x="45" y="96" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">四片使用 0x20～0x23；六片庫存中兩片備用。依板上印字接線，圖框不是實際排針順序。</text>
<rect x="45" y="140" width="290" height="150" rx="13" fill="#fff" stroke="#bfd0c5" stroke-width="2"/>
<text x="63" y="174" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">12V 電源</text>
<text x="65" y="210" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">正端經保險絲／主開關</text>
<text x="65" y="239" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">負端回共地</text>
<rect x="440" y="140" width="290" height="150" rx="13" fill="#fff" stroke="#bfd0c5" stroke-width="2"/>
<text x="458" y="174" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">LM2596：5.0V</text>
<text x="460" y="210" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">IN+ 接 12V</text>
<text x="460" y="239" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">IN−／OUT− 接共地</text>
<rect x="1050" y="140" width="335" height="150" rx="13" fill="#fff" stroke="#bfd0c5" stroke-width="2"/>
<text x="1068" y="174" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">馬達 12V 分支</text>
<text x="1070" y="210" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">獨立實體開關</text>
<text x="1070" y="239" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">供各 ULN 正端／COM</text>
<polyline class="wire" points="335,180 400,180 440,180" stroke="#d27915" stroke-width="4" marker-end="url(#arrow)"/>
<polyline class="wire" points="400,180 400,125 1010,125 1010,180 1050,180" stroke="#d27915" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="400" cy="180" r="5" fill="#d27915"/>
<polyline class="wire" points="730,180 950,180 950,335 210,335 210,390" stroke="#cc3746" stroke-width="4" marker-end="url(#arrow)"/>
<polyline class="wire" points="950,335 1220,335 1220,390" stroke="#cc3746" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="950" cy="335" r="5" fill="#cc3746"/>
<text x="490" y="324" font-size="18" font-weight="normal" text-anchor="start" style="fill:#cc3746">控制 5V：ESP32 5V、四片 MCP VCC、Hall VCC、P011 VCCB</text>
<rect x="45" y="390" width="350" height="370" rx="13" fill="#edf3ff" stroke="#bfd0c5" stroke-width="2"/>
<text x="63" y="424" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">AI-Thinker ESP32-CAM</text>
<circle cx="395" cy="480" r="5" fill="#2b65c8"/>
<text x="381" y="486" font-size="17" font-weight="normal" text-anchor="end" style="fill:#2b65c8">GPIO13 / SDA</text>
<circle cx="395" cy="550" r="5" fill="#00866b"/>
<text x="381" y="556" font-size="17" font-weight="normal" text-anchor="end" style="fill:#00866b">GPIO14 / SCL</text>
<circle cx="395" cy="620" r="5" fill="#d27915"/>
<text x="381" y="626" font-size="17" font-weight="normal" text-anchor="end" style="fill:#d27915">GPIO15 / OD RST</text>
<circle cx="395" cy="700" r="5" fill="#8357b0"/>
<text x="381" y="706" font-size="17" font-weight="normal" text-anchor="end" style="fill:#8357b0">3V3 輸出</text>
<circle cx="210" cy="390" r="5" fill="#cc3746"/>
<text x="224" y="396" font-size="17" font-weight="normal" text-anchor="start" style="fill:#cc3746">5V</text>
<circle cx="210" cy="760" r="5" fill="#384b47"/>
<text x="196" y="766" font-size="17" font-weight="normal" text-anchor="end" style="fill:#384b47">GND</text>
<text x="65" y="448" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">相機／SD／閃光燈停用</text>
<rect x="560" y="390" width="320" height="370" rx="13" fill="#f5effa" stroke="#bfd0c5" stroke-width="2"/>
<text x="578" y="424" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">P011 現有 8 路板</text>
<circle cx="560" cy="480" r="5" fill="#2b65c8"/>
<text x="574" y="486" font-size="17" font-weight="normal" text-anchor="start" style="fill:#2b65c8">A0</text>
<circle cx="880" cy="480" r="5" fill="#2b65c8"/>
<text x="866" y="486" font-size="17" font-weight="normal" text-anchor="end" style="fill:#2b65c8">B0</text>
<polyline class="wire" points="395,480 560,480" stroke="#2b65c8" stroke-width="3"/>
<polyline class="wire" points="660,480 780,480" stroke="#2b65c8" stroke-width="2"/>
<circle cx="560" cy="550" r="5" fill="#00866b"/>
<text x="574" y="556" font-size="17" font-weight="normal" text-anchor="start" style="fill:#00866b">A1</text>
<circle cx="880" cy="550" r="5" fill="#00866b"/>
<text x="866" y="556" font-size="17" font-weight="normal" text-anchor="end" style="fill:#00866b">B1</text>
<polyline class="wire" points="395,550 560,550" stroke="#00866b" stroke-width="3"/>
<polyline class="wire" points="660,550 780,550" stroke="#00866b" stroke-width="2"/>
<circle cx="560" cy="620" r="5" fill="#d27915"/>
<text x="574" y="626" font-size="17" font-weight="normal" text-anchor="start" style="fill:#d27915">A2</text>
<circle cx="880" cy="620" r="5" fill="#d27915"/>
<text x="866" y="626" font-size="17" font-weight="normal" text-anchor="end" style="fill:#d27915">B2</text>
<polyline class="wire" points="395,620 560,620" stroke="#d27915" stroke-width="3"/>
<polyline class="wire" points="660,620 780,620" stroke="#d27915" stroke-width="2"/>
<circle cx="560" cy="700" r="5" fill="#8357b0"/>
<text x="574" y="706" font-size="17" font-weight="normal" text-anchor="start" style="fill:#8357b0">VCCA</text>
<circle cx="880" cy="700" r="5" fill="#cc3746"/>
<text x="866" y="706" font-size="17" font-weight="normal" text-anchor="end" style="fill:#cc3746">VCCB</text>
<circle cx="720" cy="760" r="5" fill="#384b47"/>
<text x="706" y="766" font-size="17" font-weight="normal" text-anchor="end" style="fill:#384b47">GND</text>
<polyline class="wire" points="395,700 560,700" stroke="#8357b0" stroke-width="3"/>
<polyline class="wire" points="950,335 950,700 880,700" stroke="#cc3746" stroke-width="3"/>
<text x="580" y="738" font-size="16" font-weight="normal" text-anchor="start" style="fill:#183f36">A3～A7／B3～B7 不接；無 OE</text>
<rect x="1060" y="390" width="325" height="370" rx="13" fill="#e7f3ec" stroke="#bfd0c5" stroke-width="2"/>
<text x="1078" y="424" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">四片 MCP23017</text>
<circle cx="1220" cy="390" r="5" fill="#cc3746"/>
<text x="1234" y="396" font-size="17" font-weight="normal" text-anchor="start" style="fill:#cc3746">VCC 5V</text>
<circle cx="1060" cy="480" r="5" fill="#2b65c8"/>
<text x="1074" y="486" font-size="17" font-weight="normal" text-anchor="start" style="fill:#2b65c8">全部 SDA</text>
<polyline class="wire" points="880,480 1060,480" stroke="#2b65c8" stroke-width="3"/>
<circle cx="1060" cy="550" r="5" fill="#00866b"/>
<text x="1074" y="556" font-size="17" font-weight="normal" text-anchor="start" style="fill:#00866b">全部 SCL</text>
<polyline class="wire" points="880,550 1060,550" stroke="#00866b" stroke-width="3"/>
<circle cx="1060" cy="620" r="5" fill="#d27915"/>
<text x="1074" y="626" font-size="17" font-weight="normal" text-anchor="start" style="fill:#d27915">全部 RST</text>
<polyline class="wire" points="880,620 1060,620" stroke="#d27915" stroke-width="3"/>
<text x="1080" y="680" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">0x20／0x21／0x22 → ULN</text>
<text x="1080" y="714" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">0x23 ← 十路 Hall</text>
<circle cx="1220" cy="760" r="5" fill="#384b47"/>
<text x="1206" y="766" font-size="17" font-weight="normal" text-anchor="end" style="fill:#384b47">全部 GND</text>
<polyline class="wire" points="25,795 1385,795" stroke="#384b47" stroke-width="4"/>
<polyline class="wire" points="210,760 210,795" stroke="#384b47" stroke-width="3"/>
<circle cx="210" cy="795" r="5" fill="#384b47"/>
<polyline class="wire" points="720,760 720,795" stroke="#384b47" stroke-width="3"/>
<circle cx="720" cy="795" r="5" fill="#384b47"/>
<polyline class="wire" points="1220,760 1220,795" stroke="#384b47" stroke-width="3"/>
<circle cx="1220" cy="795" r="5" fill="#384b47"/>
<polyline class="wire" points="65,290 25,290 25,795" stroke="#384b47" stroke-width="3"/>
<circle cx="65" cy="290" r="5" fill="#384b47"/>
<text x="79" y="296" font-size="17" font-weight="normal" text-anchor="start" style="fill:#384b47">GND</text>
<circle cx="585" cy="290" r="5" fill="#384b47"/>
<text x="599" y="296" font-size="17" font-weight="normal" text-anchor="start" style="fill:#384b47">GND</text>
<polyline class="wire" points="585,290 585,307 420,307 420,795" stroke="#384b47" stroke-width="3"/>
<circle cx="420" cy="795" r="5" fill="#384b47"/>
<rect x="1060" y="855" width="325" height="155" rx="13" fill="#fff" stroke="#bfd0c5" stroke-width="2"/>
<text x="1078" y="889" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">10 組 ULN＋12V 馬達</text>
<text x="1080" y="920" font-size="16" font-weight="normal" text-anchor="start" style="fill:#183f36">相位接法見 U0～U9 圖</text>
<text x="1080" y="949" font-size="16" font-weight="normal" text-anchor="start" style="fill:#183f36">馬達五線插頭接原 ULN 插座</text>
<polyline class="wire" points="1385,245 1420,245 1420,910 1385,910" stroke="#d27915" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="1220" cy="1010" r="5" fill="#384b47"/>
<text x="1206" y="1016" font-size="17" font-weight="normal" text-anchor="end" style="fill:#384b47">ULN GND</text>
<polyline class="wire" points="1220,1010 1220,1028 1430,1028 1430,795 1385,795" stroke="#384b47" stroke-width="3"/>
<polyline class="wire" points="1385,720 1400,720 1400,835 1210,835 1210,855" stroke="#2b65c8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="45" y="840" width="945" height="175" rx="13" fill="#fff" stroke="#bfd0c5" stroke-width="2"/>
<text x="63" y="874" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">接線要點</text>
<text x="65" y="900" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">P011 只轉換訊號；MCP VCC 接控制 5V，不接 12V。所有 GND 共地。</text>
<text x="65" y="929" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">移除原 ESP32 GPIO13／14 到 Mega 的 UART 線；不插 SD 卡。</text>
<text x="65" y="958" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">各板都有電才接訊號；先關馬達分支再改線。RST 拉低不等於切斷 12V。</text>
<text x="45" y="1050" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">線色：紅=5V　紫=3.3V　橘=12V／重設訊號（依標籤區分）　藍=SDA／相位　綠=SCL　灰黑=共地。</text>
</svg>
