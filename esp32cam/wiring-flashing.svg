<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 920" role="img" aria-labelledby="title desc">
<title id="title">單主控燒錄：一條 CP2102 USB</title><desc id="desc">CP2102 只接 TXD、RXD、GND；控制電源由 LM2596 的穩壓 5.0V 提供。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans CJK TC",sans-serif;fill:#183f36}.wire{fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="1300" height="920" fill="#f3f6ef"/>
<text x="45" y="62" font-size="30" font-weight="bold" text-anchor="start" style="fill:#183f36">單主控燒錄：一條 CP2102 USB</text>
<text x="45" y="96" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">CP2102 只接 TXD、RXD、GND；控制電源由 LM2596 的穩壓 5.0V 提供。</text>
<rect x="60" y="150" width="500" height="130" rx="13" fill="#fff" stroke="#bfd0c5" stroke-width="2"/>
<text x="78" y="184" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">12V → LM2596 → 5.0V</text>
<text x="80" y="215" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">馬達 12V 分支關閉；控制電源保留</text>
<text x="80" y="244" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">外部 5V 接 ESP32 板上「5V」腳</text>
<rect x="60" y="340" width="365" height="310" rx="13" fill="#e7f3ec" stroke="#bfd0c5" stroke-width="2"/>
<text x="78" y="374" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">電腦 USB → CP2102</text>
<circle cx="425" cy="420" r="5" fill="#2b65c8"/>
<text x="411" y="426" font-size="17" font-weight="normal" text-anchor="end" style="fill:#2b65c8">TXD（3.3V 邏輯）</text>
<circle cx="425" cy="500" r="5" fill="#00866b"/>
<text x="411" y="506" font-size="17" font-weight="normal" text-anchor="end" style="fill:#00866b">RXD</text>
<circle cx="240" cy="650" r="5" fill="#384b47"/>
<text x="226" y="656" font-size="17" font-weight="normal" text-anchor="end" style="fill:#384b47">GND</text>
<text x="80" y="568" font-size="18" font-weight="normal" text-anchor="start" style="fill:#cc3746">5V／3V3／VCC：全部不接</text>
<text x="80" y="610" font-size="18" font-weight="normal" text-anchor="start" style="fill:#183f36">DTR／RTS：不接</text>
<rect x="835" y="300" width="385" height="350" rx="13" fill="#edf3ff" stroke="#bfd0c5" stroke-width="2"/>
<text x="853" y="334" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">AI-Thinker ESP32-CAM</text>
<circle cx="1025" cy="300" r="5" fill="#cc3746"/>
<text x="1039" y="306" font-size="17" font-weight="normal" text-anchor="start" style="fill:#cc3746">5V</text>
<circle cx="835" cy="420" r="5" fill="#2b65c8"/>
<text x="849" y="426" font-size="17" font-weight="normal" text-anchor="start" style="fill:#2b65c8">U0R / GPIO3</text>
<circle cx="835" cy="500" r="5" fill="#00866b"/>
<text x="849" y="506" font-size="17" font-weight="normal" text-anchor="start" style="fill:#00866b">U0T / GPIO1</text>
<circle cx="1220" cy="365" r="5" fill="#384b47"/>
<text x="1206" y="371" font-size="17" font-weight="normal" text-anchor="end" style="fill:#384b47">GPIO0</text>
<circle cx="1025" cy="650" r="5" fill="#384b47"/>
<text x="1011" y="656" font-size="17" font-weight="normal" text-anchor="end" style="fill:#384b47">GND</text>
<text x="855" y="568" font-size="18" font-weight="normal" text-anchor="start" style="fill:#183f36">板上 RESET：按下重設</text>
<text x="855" y="610" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">GPIO13／14／15 為 MCP 訊號</text>
<polyline class="wire" points="560,200 1025,200 1025,300" stroke="#cc3746" stroke-width="4" marker-end="url(#arrow)"/>
<polyline class="wire" points="425,420 835,420" stroke="#2b65c8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="530" y="402" font-size="18" font-weight="normal" text-anchor="start" style="fill:#2b65c8">TX → RX</text>
<polyline class="wire" points="835,500 425,500" stroke="#00866b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="530" y="482" font-size="18" font-weight="normal" text-anchor="start" style="fill:#00866b">RX ← TX</text>
<polyline class="wire" points="40,700 1265,700" stroke="#384b47" stroke-width="4"/>
<polyline class="wire" points="240,650 240,700" stroke="#384b47" stroke-width="3"/>
<circle cx="240" cy="700" r="5" fill="#384b47"/>
<polyline class="wire" points="1025,650 1025,700" stroke="#384b47" stroke-width="3"/>
<circle cx="1025" cy="700" r="5" fill="#384b47"/>
<polyline class="wire" points="60,245 40,245 40,700" stroke="#384b47" stroke-width="3"/>
<polyline class="wire" points="1220,365 1265,365 1265,700" stroke="#384b47" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="60" y="750" width="1160" height="135" rx="13" fill="#fff" stroke="#bfd0c5" stroke-width="2"/>
<text x="78" y="784" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">燒錄順序</text>
<text x="80" y="810" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">關馬達支路 → GPIO0 接 GND → 按 RESET → VS Code 上傳 → 移除 GPIO0 跳線 → RESET</text>
<text x="80" y="839" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">先備份舊網頁設定；單主控首次用 USB 燒錄。之後網頁只上傳本版 .sffw；MCP 不需燒錄。</text>
</svg>
