<text x="975" y="449" font-size="15" font-weight="bold" text-anchor="end" style="fill:#9aa8a3">GPA7</text>
<text x="1010" y="449" font-size="14" font-weight="normal" text-anchor="start" style="fill:#9aa8a3">不接（只能當輸出）</text>
<text x="975" y="476" font-size="15" font-weight="bold" text-anchor="end" style="fill:#183f36">GPB0</text>
<polyline class="wire" points="990,471 1150,471" stroke="#b08a00" stroke-width="3"/>
<circle cx="990" cy="471" r="5" fill="#b08a00"/>
