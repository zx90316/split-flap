<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1240" role="img" aria-labelledby="title desc">
<title id="title">單主控逐腳對照：MCP23017 → ULN2003 IN／KY-003</title><desc id="desc">同一片的四顆馬達合併成一筆 16-bit 寫入；IN 順序接錯可在網頁用 ORDER／DIR 校正，不必改線。</desc>
