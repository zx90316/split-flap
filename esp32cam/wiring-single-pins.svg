<polyline class="wire" points="990,579 1150,579" stroke="#b08a00" stroke-width="3"/>
<circle cx="990" cy="579" r="5" fill="#b08a00"/>
<text x="1160" y="584" font-size="15" font-weight="normal" text-anchor="start" style="fill:#183f36">U4 KY-003 OUT</text>
<text x="975" y="611" font-size="15" font-weight="bold" text-anchor="end" style="fill:#9aa8a3">GPB5</text>
<text x="1010" y="611" font-size="14" font-weight="normal" text-anchor="start" style="fill:#9aa8a3">不接</text>
<text x="975" y="638" font-size="15" font-weight="bold" text-anchor="end" style="fill:#9aa8a3">GPB6</text>
<text x="1010" y="638" font-size="14" font-weight="normal" text-anchor="start" style="fill:#9aa8a3">不接</text>
<text x="975" y="665" font-size="15" font-weight="bold" text-anchor="end" style="fill:#9aa8a3">GPB7</text>
<text x="1010" y="665" font-size="14" font-weight="normal" text-anchor="start" style="fill:#9aa8a3">不接（只能當輸出）</text>
<text x="820" y="728" font-size="15" font-weight="normal" text-anchor="start" style="fill:#183f36">KY-003：+ 接 5V、− 接 GND；低電位＝磁鐵到位。</text>
<text x="820" y="757" font-size="15" font-weight="normal" text-anchor="start" style="fill:#183f36">MCP 內建上拉已由韌體開啟，不必外加電阻。</text>
<rect x="800" y="820" width="655" height="230" rx="13" fill="#edf3ff" stroke="#bfd0c5" stroke-width="2"/>
<text x="818" y="854" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">MCP23017 模組排針（四片相同）</text>
<text x="830" y="885" font-size="15" font-weight="bold" text-anchor="start" style="fill:#cc3746">VCC</text>
<text x="950" y="885" font-size="15" font-weight="normal" text-anchor="start" style="fill:#183f36">5V 控制分配</text>
<text x="830" y="908" font-size="15" font-weight="bold" text-anchor="start" style="fill:#384b47">GND</text>
<text x="950" y="908" font-size="15" font-weight="normal" text-anchor="start" style="fill:#183f36">共地</text>
<text x="830" y="931" font-size="15" font-weight="bold" text-anchor="start" style="fill:#2b65c8">SDA</text>
<text x="950" y="931" font-size="15" font-weight="normal" text-anchor="start" style="fill:#183f36">P011 B0 ← A0 ← ESP GPIO21</text>
<text x="830" y="954" font-size="15" font-weight="bold" text-anchor="start" style="fill:#00866b">SCL</text>
<text x="950" y="954" font-size="15" font-weight="normal" text-anchor="start" style="fill:#183f36">P011 B1 ← A1 ← ESP GPIO22</text>
<text x="830" y="977" font-size="15" font-weight="bold" text-anchor="start" style="fill:#b04a9e">RST</text>
<text x="950" y="977" font-size="15" font-weight="normal" text-anchor="start" style="fill:#183f36">P011 B2 ← A2 ← ESP GPIO23（低＝重設）</text>
<text x="830" y="1000" font-size="15" font-weight="bold" text-anchor="start" style="fill:#384b47">ITA／ITB</text>
<text x="950" y="1000" font-size="15" font-weight="normal" text-anchor="start" style="fill:#183f36">不接</text>
<text x="830" y="1023" font-size="15" font-weight="bold" text-anchor="start" style="fill:#183f36">A0 A1 A2</text>
<text x="950" y="1023" font-size="15" font-weight="normal" text-anchor="start" style="fill:#183f36">依地址接 GND／VCC，不可浮接</text>
<text x="45" y="1175" font-size="17" font-weight="bold" text-anchor="start" style="fill:#183f36">地址：0x20 ＝ A2 A1 A0 全接 GND；0x21 ＝ 只有 A0 接 VCC；0x22 ＝ 只有 A1 接 VCC；0x23 ＝ A1、A0 接 VCC。</text>
<text x="45" y="1205" font-size="17" font-weight="normal" text-anchor="start" style="fill:#cc3746">12V 只進 ULN2003 的 +；MCP、霍爾、P011 B 側都在 5V；ESP32 與 P011 A 側在 3.3V。</text>
</svg>
