<text x="45" y="62" font-size="30" font-weight="bold" text-anchor="start" style="fill:#183f36">單主控逐腳對照：MCP23017 → ULN2003 IN／KY-003</text>
<text x="45" y="96" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">同一片的四顆馬達合併成一筆 16-bit 寫入；IN 順序接錯可在網頁用 ORDER／DIR 校正，不必改線。</text>
