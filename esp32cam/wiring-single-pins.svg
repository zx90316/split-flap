<circle cx="990" cy="336" r="5" fill="#b08a00"/>
<text x="1160" y="341" font-size="15" font-weight="normal" text-anchor="start" style="fill:#183f36">U8 KY-003 OUT</text>
<text x="975" y="368" font-size="15" font-weight="bold" text-anchor="end" style="fill:#183f36">GPA4</text>
<polyline class="wire" points="990,363 1150,363" stroke="#b08a00" stroke-width="3"/>
<circle cx="990" cy="363" r="5" fill="#b08a00"/>
