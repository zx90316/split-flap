<text x="245" y="654" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">U7</text>
<text x="410" y="654" font-size="19" font-weight="normal" text-anchor="start" style="fill:#2b65c8">GPB4 / GPB5 / GPB6 / GPB7</text>
<text x="820" y="654" font-size="19" font-weight="normal" text-anchor="start" style="fill:#00866b">IN1 / IN2 / IN3 / IN4</text>
<text x="1190" y="654" font-size="18" font-weight="normal" text-anchor="start" style="fill:#183f36">U7 五線插頭</text>
<polyline class="wire" points="45,678 1385,678" stroke="#d4dfd8" stroke-width="1"/>
<text x="60" y="716" font-size="21" font-weight="normal" text-anchor="start" style="fill:#183f36">0x22</text>
<text x="245" y="716" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">U8</text>
<text x="410" y="716" font-size="19" font-weight="normal" text-anchor="start" style="fill:#2b65c8">GPA0 / GPA1 / GPA2 / GPA3</text>
<text x="820" y="716" font-size="19" font-weight="normal" text-anchor="start" style="fill:#00866b">IN1 / IN2 / IN3 / IN4</text>
<text x="1190" y="716" font-size="18" font-weight="normal" text-anchor="start" style="fill:#183f36">U8 五線插頭</text>
<polyline class="wire" points="45,740 1385,740" stroke="#d4dfd8" stroke-width="1"/>
<text x="60" y="778" font-size="21" font-weight="normal" text-anchor="start" style="fill:#183f36">0x22</text>
<text x="245" y="778" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">U9</text>
<text x="410" y="778" font-size="19" font-weight="normal" text-anchor="start" style="fill:#2b65c8">GPA4 / GPA5 / GPA6 / GPA7</text>
<text x="820" y="778" font-size="19" font-weight="normal" text-anchor="start" style="fill:#00866b">IN1 / IN2 / IN3 / IN4</text>
<text x="1190" y="778" font-size="18" font-weight="normal" text-anchor="start" style="fill:#183f36">U9 五線插頭</text>
<polyline class="wire" points="45,802 1385,802" stroke="#d4dfd8" stroke-width="1"/>
<rect x="45" y="855" width="655" height="245" rx="13" fill="#fff" stroke="#bfd0c5" stroke-width="2"/>
<text x="63" y="889" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">電源與地址</text>
<text x="65" y="915" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">MCP VCC＝控制 5V；GND＝共地。</text>
<text x="65" y="944" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">地址 A2 A1 A0：0x20＝000，0x21＝001，0x22＝010。</text>
<text x="65" y="973" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">每片 ULN 正端／COM＝有開關的 12V_MOTOR。</text>
<text x="65" y="1002" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">ULN GND 回電源共地；不能把 COM 接 5V。</text>
<text x="65" y="1031" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">未啟用 U 的相位輸出低；0x22 GPB 全部保持低。</text>
<rect x="730" y="855" width="655" height="245" rx="13" fill="#fff" stroke="#bfd0c5" stroke-width="2"/>
<text x="748" y="889" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">相序與模組名稱</text>
<text x="750" y="915" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">以實際 IN1～IN4 印字接線；若需調相序用 ORDER。</text>
<text x="750" y="944" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">四路是驅動訊號，不直接供應線圈電流。</text>
<text x="750" y="973" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">MCP 地址 A0/A1/A2、GPA/GPB 和 P011 A0 互不相同。</text>
<text x="750" y="1002" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">四片 MCP 的 SDA／SCL／RST 並接到正常運作圖。</text>
<text x="750" y="1031" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">只使用 0x20～0x22 作馬達，0x23 保留給 Hall。</text>
<text x="45" y="1140" font-size="18" font-weight="normal" text-anchor="start" style="fill:#183f36">相位對應與原版 45 片順序維持；每圈步數與方向依各機構校準。</text>
</svg>
