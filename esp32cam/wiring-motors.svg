<text x="60" y="530" font-size="21" font-weight="normal" text-anchor="start" style="fill:#183f36">0x21</text>
<text x="245" y="530" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">U5</text>
<text x="410" y="530" font-size="19" font-weight="normal" text-anchor="start" style="fill:#2b65c8">GPA4 / GPA5 / GPA6 / GPA7</text>
<text x="820" y="530" font-size="19" font-weight="normal" text-anchor="start" style="fill:#00866b">IN1 / IN2 / IN3 / IN4</text>
<text x="1190" y="530" font-size="18" font-weight="normal" text-anchor="start" style="fill:#183f36">U5 五線插頭</text>
