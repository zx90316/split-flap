<text x="245" y="344" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">U2</text>
<text x="410" y="344" font-size="19" font-weight="normal" text-anchor="start" style="fill:#2b65c8">GPB0 / GPB1 / GPB2 / GPB3</text>
<text x="820" y="344" font-size="19" font-weight="normal" text-anchor="start" style="fill:#00866b">IN1 / IN2 / IN3 / IN4</text>
<text x="1190" y="344" font-size="18" font-weight="normal" text-anchor="start" style="fill:#183f36">U2 五線插頭</text>
<polyline class="wire" points="45,368 1385,368" stroke="#d4dfd8" stroke-width="1"/>
