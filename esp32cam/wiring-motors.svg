<text x="410" y="406" font-size="19" font-weight="normal" text-anchor="start" style="fill:#2b65c8">GPB4 / GPB5 / GPB6 / GPB7</text>
<text x="820" y="406" font-size="19" font-weight="normal" text-anchor="start" style="fill:#00866b">IN1 / IN2 / IN3 / IN4</text>
<text x="1190" y="406" font-size="18" font-weight="normal" text-anchor="start" style="fill:#183f36">U3 五線插頭</text>
<polyline class="wire" points="45,430 1385,430" stroke="#d4dfd8" stroke-width="1"/>
<text x="60" y="468" font-size="21" font-weight="normal" text-anchor="start" style="fill:#183f36">0x21</text>
<text x="245" y="468" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">U4</text>
<text x="410" y="468" font-size="19" font-weight="normal" text-anchor="start" style="fill:#2b65c8">GPA0 / GPA1 / GPA2 / GPA3</text>
<text x="820" y="468" font-size="19" font-weight="normal" text-anchor="start" style="fill:#00866b">IN1 / IN2 / IN3 / IN4</text>
<text x="1190" y="468" font-size="18" font-weight="normal" text-anchor="start" style="fill:#183f36">U4 五線插頭</text>
