<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1170" role="img" aria-labelledby="title desc">
<title id="title">MCP → ULN2003：U0～U9 四相逐線表</title><desc id="desc">每列四個 MCP 腳依序接同一片 ULN 的 IN1、IN2、IN3、IN4；馬達插頭維持接 ULN 原插座。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans CJK TC",sans-serif;fill:#183f36}.wire{fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="1440" height="1170" fill="#f3f6ef"/>
<text x="45" y="62" font-size="30" font-weight="bold" text-anchor="start" style="fill:#183f36">MCP → ULN2003：U0～U9 四相逐線表</text>
<text x="45" y="96" font-size="17" font-weight="normal" text-anchor="start" style="fill:#183f36">每列四個 MCP 腳依序接同一片 ULN 的 IN1、IN2、IN3、IN4；馬達插頭維持接 ULN 原插座。</text>
<text x="60" y="165" font-size="20" font-weight="bold" text-anchor="start" style="fill:#183f36">MCP 地址</text>
<text x="245" y="165" font-size="20" font-weight="bold" text-anchor="start" style="fill:#183f36">顯示位</text>
<text x="410" y="165" font-size="20" font-weight="bold" text-anchor="start" style="fill:#183f36">MCP 腳位（依序）</text>
<text x="820" y="165" font-size="20" font-weight="bold" text-anchor="start" style="fill:#183f36">ULN 輸入（依序）</text>
<text x="1190" y="165" font-size="20" font-weight="bold" text-anchor="start" style="fill:#183f36">馬達</text>
<text x="60" y="220" font-size="21" font-weight="normal" text-anchor="start" style="fill:#183f36">0x20</text>
<text x="245" y="220" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">U0</text>
<text x="410" y="220" font-size="19" font-weight="normal" text-anchor="start" style="fill:#2b65c8">GPA0 / GPA1 / GPA2 / GPA3</text>
<text x="820" y="220" font-size="19" font-weight="normal" text-anchor="start" style="fill:#00866b">IN1 / IN2 / IN3 / IN4</text>
<text x="1190" y="220" font-size="18" font-weight="normal" text-anchor="start" style="fill:#183f36">U0 五線插頭</text>
<polyline class="wire" points="45,244 1385,244" stroke="#d4dfd8" stroke-width="1"/>
<text x="60" y="282" font-size="21" font-weight="normal" text-anchor="start" style="fill:#183f36">0x20</text>
<text x="245" y="282" font-size="22" font-weight="bold" text-anchor="start" style="fill:#183f36">U1</text>
<text x="410" y="282" font-size="19" font-weight="normal" text-anchor="start" style="fill:#2b65c8">GPA4 / GPA5 / GPA6 / GPA7</text>
<text x="820" y="282" font-size="19" font-weight="normal" text-anchor="start" style="fill:#00866b">IN1 / IN2 / IN3 / IN4</text>
<text x="1190" y="282" font-size="18" font-weight="normal" text-anchor="start" style="fill:#183f36">U1 五線插頭</text>
<polyline class="wire" points="45,306 1385,306" stroke="#d4dfd8" stroke-width="1"/>
