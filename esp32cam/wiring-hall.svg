<text x="65" y="805" font-size="18" font-weight="normal" text-anchor="start" style="fill:#183f36">0x23 地址 A2 A1 A0＝011。VCC＝5V，GND＝共地，RST 接四片共用重設線。</text>
<text x="65" y="834" font-size="18" font-weight="normal" text-anchor="start" style="fill:#183f36">GPA7／GPB7 與其餘未使用輸出保持低；每路 S／OUT 分開，不把十路訊號短接。</text>
<text x="65" y="863" font-size="18" font-weight="normal" text-anchor="start" style="fill:#183f36">核對 KY-003 板上 S／+／−；不要照模組外觀猜針序。預設 POLARITY LOW，依實測確認。</text>
<text x="65" y="892" font-size="18" font-weight="normal" text-anchor="start" style="fill:#183f36">先 WATCH 看原始訊號，再試 HOME／MEASURE；尚無磁鐵時沿用手動定位。</text>
